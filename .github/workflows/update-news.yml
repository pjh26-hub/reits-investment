# 부동산 뉴스 자동 수집 (뉴스 탭)
#   네이버 뉴스 검색 API 로 주거용·상업용 최신 기사 '제목·언론사·시간·링크'만 모아 data/news.json 을 고친다.
#   기사 본문은 저장하지 않는다. 화면에서 누르면 언론사 원문으로 간다.
#   필요한 Secret (둘 중 하나): ① NAVER_CLIENT_ID + NAVER_CLIENT_SECRET (developers.naver.com)
#                             ② NAVER_HUB_KEY_ID + NAVER_HUB_KEY (네이버 클라우드 NAVER API HUB)
#   키가 없으면 아무것도 안 하고 끝남
#   data/meta.json 은 건드리지 않는다 (시세 자동 갱신과 커밋이 부딪히지 않게).

name: 부동산 뉴스 자동 수집

on:
  schedule:
    # 매일 07:10 ~ 23:10 (한국 시간) 1시간마다 = UTC 22,23시 + 0~14시
    - cron: "10 22,23,0-14 * * *"
  workflow_dispatch: {}          # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write                # data/news.json 커밋·푸시에 필요

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install "requests>=2.31"

      # 키가 하나도 없으면 스크립트가 "[건너뜀]" 을 찍고 그냥 끝난다 (data/news.json 그대로 → 커밋도 안 함)
      - name: 뉴스 받기
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_HUB_KEY_ID: ${{ secrets.NAVER_HUB_KEY_ID }}
          NAVER_HUB_KEY: ${{ secrets.NAVER_HUB_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/fetch_news.py

      - name: 바뀐 뉴스 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "바뀐 뉴스가 없어서 커밋하지 않아요."
            exit 0
          fi
          git commit -m "chore(data): 부동산 뉴스 자동 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
