# 리츠 시세 자동 갱신 (전일 종가)
#   국내 리츠·리츠 ETF: 금융위원회 주식시세정보·증권상품시세정보 (공공데이터포털, 공공누리 제4유형)
#   미국 리츠: Finnhub — FINNHUB_API_KEY Secret 이 있을 때만 (없으면 마지막 값을 그대로 둠)
#   data/prices.json · data/history.json(1년 그래프) · data/meta.json 을 고쳐서 자동으로 커밋·푸시한다.
#   API 키는 저장소 Settings > Secrets and variables > Actions 에만 둔다. 화면(브라우저)에는 키가 나가지 않는다.
#
#   공개 링크에는 전날 종가만 보여준다. (한국투자증권 KIS 시세는 재배포 문제로 쓰지 않음, 2026-11-23 팀 결정)
#   필요한 Secret: DATA_GO_KR_KEY   (선택) FINNHUB_API_KEY
#
#   전일 종가는 다음 영업일 오후 1시 이후에 올라온다. 그래서 오후 2시 반에 한 번, 혹시 늦을 때를 위해 6시 반에 한 번 더 돈다.
#   GitHub 의 예약 실행은 몇 분~수십 분 늦게 시작될 수 있다. (GitHub 서버 사정)

name: 리츠 시세 자동 갱신

on:
  schedule:
    # 평일 14:30, 18:30 (한국 시간) = UTC 05:30, 09:30
    - cron: "30 5 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}          # Actions 탭에서 "Run workflow" 버튼으로 바로 실행

permissions:
  contents: write                # data/*.json 커밋·푸시에 필요

concurrency:
  group: update-prices           # 한 번에 하나만 실행 (배당 자동 갱신과 같은 줄)
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install "requests>=2.31"

      - name: 시세 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python scripts/update_prices.py

      - name: 바뀐 시세 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json data/meta.json
          if git diff --cached --quiet; then
            echo "바뀐 시세가 없어서 커밋하지 않아요."
            exit 0
          fi
          git commit -m "chore(data): 리츠 시세 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
