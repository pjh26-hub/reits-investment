<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홍보 카드 만들기 | 리츠 투자</title>
  <meta name="description" content="타깃에 맞는 문구로 리츠 홍보 카드를 만들고, 쓰면 안 되는 표현은 자동으로 걸러내기">
  <link rel="stylesheet" href="css/style.css?v=20261128d">
  <style>
    /* 홍보 카드 페이지 전용 스타일 (접두어 cardgen-). 색·간격은 style.css 의 변수만 쓴다 */
    .cardgen-layout { display: grid; gap: var(--space-5); grid-template-columns: 1fr; }
    @media (min-width: 860px) { .cardgen-layout { grid-template-columns: 1fr 1fr; align-items: start; } }
    .cardgen-option { display: block; width: 100%; margin-top: var(--space-2); padding: var(--space-4); border: var(--dim-1) solid transparent; border-radius: var(--radius-sm); background: var(--color-surface); text-align: left; font-weight: 600; cursor: pointer; }
    .cardgen-option.is-active { border-color: var(--color-primary); background: var(--color-primary-soft); }
    .cardgen-option-caption { display: block; color: var(--color-primary); font-size: var(--fs-xs); margin-bottom: var(--space-2); }
    .cardgen-option-copy { display: block; color: var(--color-text); font-size: var(--fs-sm); line-height: 1.6; }
    .cardgen-option:hover { border-color: var(--color-line); }
    .cardgen-option:focus-visible { border-color: var(--color-primary); }
    .cardgen-preview { display: block; width: 100%; height: auto; border: var(--dim-1) solid var(--color-line); border-radius: var(--radius); }
    .cardgen-hint { margin-top: var(--space-2); font-size: var(--fs-xs); color: var(--color-text-sub); }
    .cardgen-download-status { font-size: var(--fs-sm); color: var(--color-text-sub); }
    .cardgen-options-label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); flex-wrap: wrap; }
    .cardgen-count { font-size: var(--fs-xs); color: var(--color-primary); }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="container section stack">
    <div>
      <div class="chapter"><span class="chapter-tag">CARD</span><span class="chapter-name">타깃별 홍보 카드</span></div>
      <h1 class="page-title">같은 리츠, 다른 한마디</h1>
      <p class="lead">누구에게 말하느냐에 따라 문구가 달라져요. 타깃과 리츠를 고르면 문구가 나오고, 인스타용 정사각형 카드로 받을 수 있어요. 투자 광고에 쓰면 안 되는 표현은 자동으로 걸러요.</p>
    </div>

    <div class="cardgen-layout">
      <section class="stack" aria-label="문구 만들기">
        <h2 class="sec-title"><span class="sec-no">01</span> 문구 만들기</h2>
        <div>
          <span class="field-label">누구에게 보여줄까요</span>
          <div class="chip-row" id="cardgen-targets" role="group" aria-label="타깃"></div>
        </div>
        <label class="field">
          <span class="field-label">어떤 리츠인가요</span>
          <select class="select" id="cardgen-product"></select>
        </label>
        <div>
          <div class="cardgen-options-label">
            <span class="field-label">문구 고르기</span>
            <span class="cardgen-count" id="cardgen-count" aria-live="polite"></span>
          </div>
          <!-- 데이터가 있는 템플릿만 보여준다 -->
          <div id="cardgen-options" role="group" aria-label="홍보 문구"></div>
        </div>
        <label class="field">
          <span class="field-label">문구 고치기</span>
          <textarea class="textarea" id="cardgen-text" maxlength="120"></textarea>
          <span class="cardgen-hint">선택한 문구를 다듬을 수 있어요. 데이터에 없는 숫자를 추가하면 PNG 저장이 중지돼요.</span>
        </label>
        <!-- 금지어가 들어가면 보이는 빨간 경고 -->
        <p class="warn-box is-hidden" id="cardgen-warn" role="alert"></p>
        <p class="notice is-hidden" id="cardgen-notice" aria-live="polite"></p>
      </section>

      <section class="stack" aria-label="미리 보기">
        <h2 class="sec-title"><span class="sec-no">02</span> 미리 보기</h2>
        <!-- 실제 크기는 1080×1080. 화면에는 폭에 맞게 줄여서 보여준다 -->
        <canvas class="cardgen-preview" id="cardgen-canvas" width="1080" height="1080"></canvas>
        <button class="btn btn-primary" id="cardgen-download" type="button" disabled>PNG로 받기</button>
        <p class="cardgen-download-status" id="cardgen-download-status" aria-live="polite"></p>
        <p class="source-note">카드 맨 아래에는 사용한 데이터의 출처와 기준일, 투자 위험 고지 문구가 자동으로 들어가며 지울 수 없어요. 휴대폰은 공유 메뉴에서 이미지 저장을 선택할 수 있어요.</p>
      </section>
    </div>

    <div class="ad-slot ad-slot--banner" data-ad="card-bottom"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/common.js?v=20261128e"></script>
  <script src="js/card.js"></script>
</body>
</html>
